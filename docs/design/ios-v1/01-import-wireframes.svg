<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="2280" viewBox="0 0 1456 2280"><rect x="0" y="0" width="1456" height="2280" rx="0" fill="#F6F6F2" stroke="none"/><text x="52" y="49" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#666662">SCHWANKI / iOS / DESIGN STUDY 01</text><text x="52" y="115" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#232321">Bring your deck. Get to the first word.</text><text x="52" y="156" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#666662">01–06 / First use and Anki import · Native Files and provider login remain system-owned surfaces.</text><text x="52" y="2258" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#666662">LOW-FIDELITY · Oct 28, 2026 · Sample content and counts · No app implementation</text><text x="1376" y="2260" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#232321">01</text><text x="52" y="220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">01 / Welcome</text><rect x="52" y="240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="76" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="334" y="268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="182" y="253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="182" y="1065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="52" y="1119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Get started and Sign in converge on the same</text><text x="52" y="1142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">account flow. Demo needs no account.</text><text x="76" y="353" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#232321">schwanki</text><rect x="196" y="422" width="102" height="86" rx="12" fill="#ECECE6" stroke="#D4D4CE"/><text x="221.5" y="456" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#232321">GOOSE</text><text x="214.6875" y="478" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#666662">placeholder</text><text x="76" y="596" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">Your Anki deck.</text><text x="76" y="647" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">A better daily</text><text x="76" y="698" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">habit.</text><text x="76" y="744" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">Bring your cards and learning</text><text x="76" y="771" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">progress. Review one word at a time.</text><rect x="76" y="844" width="342" height="52" rx="10" fill="#232321" stroke="none"/><text x="195.4609375" y="875.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Get started</text><rect x="76" y="912" width="342" height="52" rx="10" fill="#FFFFFF" stroke="#D4D4CE"/><text x="109.5390625" y="943.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#232321">Already use Schwanki? Sign in</text><text x="159" y="1009" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#232321">Try 3 sample cards</text><text x="533" y="220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">02 / One Schwanki account</text><rect x="533" y="240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="557" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="815" y="268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="663" y="253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="663" y="1065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="533" y="1119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Provider sheet is external. Existing cards go</text><text x="533" y="1142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">directly to 07; empty accounts to 03.</text><text x="557" y="324" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">Your account</text><text x="862.578125" y="322" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Back</text><line x1="557" y1="345" x2="899" y2="345" stroke="#D4D4CE" stroke-width="1"/><text x="557" y="439" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">Your words,</text><text x="557" y="490" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">together.</text><text x="557" y="547" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#232321">Use the same Schwanki account on</text><text x="557" y="575" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#232321">iPhone and the web.</text><rect x="557" y="649" width="342" height="52" rx="10" fill="#232321" stroke="none"/><text x="630.8359375" y="680.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Continue with Google</text><text x="557" y="745" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">New here? This creates your account.</text><text x="557" y="769" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Already have one? It signs you in.</text><text x="557" y="939" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#666662">No Google Drive access needed to import an</text><text x="557" y="961" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#666662">Anki file.</text><text x="657" y="1024" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#666662">Privacy  ·  Terms</text><text x="1014" y="220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">03 / Bring an Anki deck</text><rect x="1014" y="240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1038" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="1296" y="268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="1144" y="253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="1144" y="1065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="1014" y="1119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Choose file → system Files picker → 04. Export</text><text x="1014" y="1142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">help expands here; web is optional.</text><text x="1038" y="324" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">Your first deck</text><text x="1345.796875" y="322" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Help</text><line x1="1038" y1="345" x2="1380" y2="345" stroke="#D4D4CE" stroke-width="1"/><text x="1038" y="426" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">Bring your</text><text x="1038" y="477" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">Anki deck.</text><text x="1038" y="528" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">Choose an .apkg or .colpkg export</text><text x="1038" y="555" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">from Files or iCloud Drive.</text><rect x="1038" y="606" width="342" height="52" rx="10" fill="#232321" stroke="none"/><text x="1136.6015625" y="637.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Choose Anki file</text><rect x="1038" y="674" width="342" height="52" rx="10" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1085.8125" y="705.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#232321">How do I export from Anki?</text><text x="1038" y="774" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#232321">Try 3 sample cards</text><rect x="1038" y="834" width="342" height="176" rx="12" fill="#F6F6F2" stroke="#D4D4CE"/><text x="1052" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#232321">Schwanki also works on the web</text><text x="1052" y="902" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Connect notes, edit cards and create</text><text x="1052" y="924" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">memory aids. Your cards and reviews</text><text x="1052" y="946" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">sync online.</text><text x="1052" y="990" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">Explore Schwanki on the web →</text><text x="52" y="1220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">04 / Preview import</text><rect x="52" y="1240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="76" y="1270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="334" y="1268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="182" y="1253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="182" y="2065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="52" y="2119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Show skipped content before importing.</text><text x="52" y="2142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Language stays editable; no advanced</text><text x="52" y="2165" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">mapping.</text><text x="76" y="1324" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">Check your import</text><text x="381.578125" y="1322" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Back</text><line x1="76" y1="1345" x2="418" y2="1345" stroke="#D4D4CE" stroke-width="1"/><text x="76" y="1404" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">spanish.apkg</text><text x="76" y="1440" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#666662">Choose the decks to bring over.</text><rect x="76" y="1482" width="342" height="86" rx="12" fill="#F6F6F2" stroke="#D4D4CE"/><text x="92" y="1518" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">[✓] Everyday Spanish</text><text x="128" y="1547" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#666662">184 usable cards</text><text x="76" y="1620" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#232321">Language</text><rect x="76" y="1638" width="342" height="52" rx="12" fill="#FFFFFF" stroke="#D4D4CE"/><text x="91" y="1668" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#232321">Spanish                                      ⌄</text><text x="76" y="1744" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">2 notes cannot be imported: missing a</text><text x="76" y="1768" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">word or meaning.</text><text x="76" y="1821" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#232321">A one-time transfer. Schwanki reviews</text><text x="76" y="1845" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#232321">sync with the web, not back to Anki.</text><rect x="76" y="1938" width="342" height="52" rx="10" fill="#232321" stroke="none"/><text x="169.8203125" y="1969.0" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Import 184 cards</text><text x="166" y="2026" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#666662">Choose another file</text><text x="533" y="1220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">05 / Importing</text><rect x="533" y="1240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="557" y="1270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="815" y="1268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="663" y="1253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="663" y="2065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="533" y="2119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Keep progress visible. Interruption preserves</text><text x="533" y="2142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">completed work and offers safe retry (16).</text><text x="557" y="1324" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">Importing</text><text x="899.0" y="1322" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321"></text><line x1="557" y1="1345" x2="899" y2="1345" stroke="#D4D4CE" stroke-width="1"/><text x="557" y="1448" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">Moving your</text><text x="557" y="1499" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#232321">words in.</text><text x="557" y="1557" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#232321">Everyday Spanish</text><rect x="557" y="1594" width="342" height="8" rx="4" fill="#ECECE6" stroke="none"/><rect x="557" y="1594" width="235" height="8" rx="4" fill="#232321" stroke="none"/><text x="557" y="1649" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Cards: 128 of 184</text><text x="557" y="1690" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Pictures and audio come next.</text><rect x="557" y="1789" width="342" height="114" rx="12" fill="#F6F6F2" stroke="#D4D4CE"/><text x="573" y="1825" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#232321">Keep Schwanki open while the import</text><text x="573" y="1849" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#232321">finishes. If it stops, you can retry.</text><text x="1014" y="1220" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">06 / Import complete</text><rect x="1014" y="1240" width="390" height="844" rx="28" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1038" y="1270" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#232321">9:41</text><text x="1296" y="1268" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#232321">LTE  100%</text><rect x="1144" y="1253" width="130" height="24" rx="13" fill="#080808" stroke="none"/><rect x="1144" y="2065" width="130" height="4" rx="2" fill="#232321" stroke="none"/><text x="1014" y="2119" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">Start review → 07. If nothing is due, show the</text><text x="1014" y="2142" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#666662">waiting state without changing schedules.</text><text x="1038" y="1324" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">Your deck is ready</text><text x="1380.0" y="1322" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321"></text><line x1="1038" y1="1345" x2="1380" y2="1345" stroke="#D4D4CE" stroke-width="1"/><rect x="1158" y="1401" width="102" height="86" rx="12" fill="#ECECE6" stroke="#D4D4CE"/><text x="1183.5" y="1435" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#232321">GOOSE</text><text x="1176.6875" y="1457" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#666662">placeholder</text><text x="1038" y="1574" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#232321">184 cards</text><text x="1038" y="1628" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#232321">moved in.</text><text x="1038" y="1680" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">Your supported pictures, audio and</text><text x="1038" y="1707" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#232321">learning progress came too.</text><rect x="1038" y="1770" width="342" height="84" rx="12" fill="#F6F6F2" stroke="#D4D4CE"/><text x="1055" y="1809" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">12 cards ready to review</text><text x="1055" y="1836" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#666662">Everyday Spanish</text><rect x="1038" y="1919" width="342" height="52" rx="10" f