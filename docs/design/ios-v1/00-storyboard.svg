<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450"><rect x="0" y="0" width="1600" height="1450" rx="0" fill="#F6F6F2" stroke="none"/><text x="52" y="49" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#666662">SCHWANKI / iOS / DESIGN STUDY 01</text><text x="52" y="115" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#232321">Three small journeys. One clear purpose.</text><text x="52" y="156" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#666662">Storyboard · Read each row left to right. Frame numbers refer to the wireframe boards.</text><text x="52" y="1428" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#666662">LOW-FIDELITY · Oct 28, 2026 · Sample content and counts · No app implementation</text><text x="1520" y="1430" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#232321">00</text><text x="52" y="234" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#232321">A / First deck on iPhone</text><text x="52" y="266" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#666662">“I found Schwanki. Can I use my Anki cards here?”</text><rect x="52" y="288" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="70" y="316" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">01</text><rect x="163" y="310" width="42" height="42" rx="21" fill="#FFFFFF" stroke="#232321"/><line x1="184" y1="352" x2="184" y2="403" stroke="#232321" stroke-width="2"/><line x1="184" y1="366" x2="231" y2="378" stroke="#232321" stroke-width="2"/><rect x="224" y="331" width="40" height="72" rx="6" fill="#FFFFFF" stroke="#232321"/><rect x="230" y="341" width="28" height="45" rx="0" fill="#ECECE6" stroke="none"/><line x1="184" y1="403" x2="161" y2="423" stroke="#232321" stroke-width="2"/><line x1="184" y1="403" x2="207" y2="423" stroke="#232321" stroke-width="2"/><text x="70" y="472" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Discover &amp; enter</text><text x="70" y="500" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">A clear promise and one account.</text><text x="70" y="521" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Existing learners skip import.</text><text x="70" y="554" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">01 → 02</text><text x="412" y="435" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="432" y="288" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="450" y="316" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">02</text><rect x="553" y="314" width="82" height="105" rx="8" fill="#FFFFFF" stroke="#232321"/><text x="566" y="365" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#232321">.apkg</text><text x="548" y="442" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#666662">Files / iCloud</text><text x="450" y="472" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Bring the file</text><text x="450" y="500" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Choose an Anki export from Files. Export</text><text x="450" y="521" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">help stays one tap away.</text><text x="450" y="554" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">03 + system Files</text><text x="792" y="435" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="812" y="288" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="830" y="316" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">03</text><rect x="928" y="316" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="937" y="327" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="946" y="338" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><text x="961" y="393" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#232321">Aa</text><text x="830" y="472" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Know what comes over</text><text x="830" y="500" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Preview decks, then import. Progress and</text><text x="830" y="521" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">exceptions stay visible.</text><text x="830" y="554" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">04 → 05 → 06</text><text x="1172" y="435" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="1192" y="288" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1210" y="316" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">04</text><rect x="1325" y="308" width="76" height="134" rx="12" fill="#FFFFFF" stroke="#232321"/><rect x="1332" y="326" width="62" height="95" rx="0" fill="#ECECE6" stroke="none"/><text x="1344" y="387" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#232321">Aa</text><line x1="1345" y1="430" x2="1382" y2="430" stroke="#232321" stroke-width="2"/><text x="1210" y="472" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Start reviewing</text><text x="1210" y="500" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Own cards in the feed. Reveal first;</text><text x="1210" y="521" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">buttons explain the ratings.</text><text x="1210" y="554" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">07 → 08</text><text x="52" y="624" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#232321">B / A quiet daily habit</text><text x="52" y="656" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#666662">“I have a moment. Let me get through a few words.”</text><rect x="52" y="678" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="70" y="706" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">01</text><rect x="185" y="698" width="76" height="134" rx="12" fill="#FFFFFF" stroke="#232321"/><rect x="192" y="716" width="62" height="95" rx="0" fill="#ECECE6" stroke="none"/><text x="204" y="777" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#232321">Aa</text><line x1="205" y1="820" x2="242" y2="820" stroke="#232321" stroke-width="2"/><text x="70" y="862" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Open straight to a word</text><text x="70" y="890" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">No dashboard or setup between the</text><text x="70" y="911" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">learner and the next due card.</text><text x="70" y="944" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">07</text><text x="412" y="825" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="432" y="678" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="450" y="706" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">02</text><rect x="565" y="698" width="76" height="134" rx="12" fill="#FFFFFF" stroke="#232321"/><rect x="572" y="716" width="62" height="95" rx="0" fill="#ECECE6" stroke="none"/><text x="584" y="777" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#232321">Aa</text><line x1="585" y1="820" x2="622" y2="820" stroke="#232321" stroke-width="2"/><text x="450" y="862" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Reveal, then rate</text><text x="450" y="890" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Tap to reveal. Use named buttons or</text><text x="450" y="911" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">optional swipes.</text><text x="450" y="944" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">08</text><text x="792" y="825" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="812" y="678" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="830" y="706" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">03</text><rect x="928" y="706" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="937" y="717" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="946" y="728" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><text x="961" y="783" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#232321">Aa</text><text x="830" y="862" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Leave whenever</text><text x="830" y="890" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Every rating saves before advancing.</text><text x="830" y="911" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Resume with the answer hidden.</text><text x="830" y="944" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">07 / next card</text><text x="1172" y="825" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="1192" y="678" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1210" y="706" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">04</text><rect x="1313" y="708" width="95" height="95" rx="48" fill="#FFFFFF" stroke="#232321"/><line x1="1361" y1="755" x2="1361" y2="724" stroke="#232321" stroke-width="2"/><line x1="1361" y1="755" x2="1387" y2="768" stroke="#232321" stroke-width="2"/><text x="1316" y="832" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#666662">On your terms</text><text x="1210" y="862" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Finish without a detour</text><text x="1210" y="890" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Show caught-up state. Offer an optional</text><text x="1210" y="911" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">reminder after value.</text><text x="1210" y="944" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">10 → 11</text><text x="52" y="1014" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#232321">C / Trust across devices</text><text x="52" y="1046" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#666662">“I lost signal. Did my review still count?”</text><rect x="52" y="1068" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="70" y="1096" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">01</text><rect x="185" y="1088" width="76" height="134" rx="12" fill="#FFFFFF" stroke="#232321"/><rect x="192" y="1106" width="62" height="95" rx="0" fill="#ECECE6" stroke="none"/><text x="204" y="1167" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#232321">Aa</text><line x1="205" y1="1210" x2="242" y2="1210" stroke="#232321" stroke-width="2"/><text x="70" y="1252" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Keep reviewing offline</text><text x="70" y="1280" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Previously saved cards work. Status says</text><text x="70" y="1301" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">what is on this phone.</text><text x="70" y="1334" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">14</text><text x="412" y="1215" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="432" y="1068" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="450" y="1096" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">02</text><rect x="548" y="1096" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="557" y="1107" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><rect x="566" y="1118" width="95" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4CE"/><text x="581" y="1173" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#232321">Aa</text><text x="450" y="1252" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Stop honestly at the edge</text><text x="450" y="1280" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Exhausted cache is different from having</text><text x="450" y="1301" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">no cards due.</text><text x="450" y="1334" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">15</text><text x="792" y="1215" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="812" y="1068" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="830" y="1096" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">03</text><rect x="898" y="1129" width="165" height="59" rx="29" fill="#FFFFFF" stroke="#232321"/><rect x="943" y="1106" width="74" height="72" rx="36" fill="#FFFFFF" stroke="#232321"/><rect x="921" y="1137" width="123" height="44" rx="0" fill="#FFFFFF" stroke="none"/><text x="939" y="1171" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#232321">Sync</text><text x="830" y="1252" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Reconnect &amp; sync</text><text x="830" y="1280" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Queued ratings upload automatically.</text><text x="830" y="1301" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Failures retain retry work.</text><text x="830" y="1334" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">12 / status</text><text x="1172" y="1215" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#666662">→</text><rect x="1192" y="1068" width="354" height="280" rx="14" fill="#FFFFFF" stroke="#D4D4CE"/><text x="1210" y="1096" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#666662">04</text><rect x="1267" y="1101" width="190" height="112" rx="8" fill="#FFFFFF" stroke="#232321"/><rect x="1278" y="1116" width="168" height="82" rx="0" fill="#ECECE6" stroke="none"/><line x1="1352" y1="1213" x2="1352" y2="1226" stroke="#232321" stroke-width="2"/><line x1="1320" y1="1226" x2="1384" y2="1226" stroke="#232321" stroke-width="2"/><text x="1301" y="1160" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#232321">Schwanki</text><text x="1301" y="1183" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#666662">Same account</text><text x="1210" y="1252" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#232321">Continue on the web</text><text x="1210" y="1280" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">Same account, same cards. Extra tools</text><text x="1210" y="1301" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#232321">are explained and linked.</text><text x="1210" y="1334" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#666662">13</text></svg>