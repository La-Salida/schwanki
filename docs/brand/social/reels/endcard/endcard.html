<html><head><meta charset="utf-8">{{FONTS}}<base href="{{BASE}}"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#fff repeating-linear-gradient(to bottom,#fff 0 62px,#E6ECF7 62px 64px);position:relative;font-family:Archivo,'{{CJK}}'}
.margin{position:absolute;left:118px;top:0;bottom:0;width:3px;background:#C8372D;opacity:.45}
.phone{position:absolute;left:264px;top:350px;width:552px;height:1157px;border-radius:70px;background:#14213D;padding:16px;box-shadow:12px 16px 0 rgba(20,33,61,.18);animation:phoneIn .38s cubic-bezier(.2,.8,.2,1) 0s both}
.screen{position:relative;width:520px;height:1125px;border-radius:56px;overflow:hidden;background:#232a3c}
.card{position:absolute;inset:0}
.inner{position:absolute;left:0;top:0;width:780px;height:1688px;transform:scale(.6667);transform-origin:0 0;background:#232A3C;overflow:hidden}
.cardA{animation:outUp .3s cubic-bezier(.5,0,.3,1) .78s both}
.cardB{animation:inUp .3s cubic-bezier(.5,0,.3,1) .78s both}
.img{position:absolute;left:0;top:0;width:780px;height:1260px;background:url({{IMG}}) {{IMGPOS}}/cover}
.img:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(35,42,60,.25) 0,transparent 12%,transparent 50%,rgba(35,42,60,.85) 78%,#232A3C 100%)}
.bar{position:absolute;top:18px;left:22px;right:22px;height:96px;display:flex;align-items:center;gap:18px;color:#fff;font:600 30px Archivo}
.circ{width:86px;height:86px;border-radius:50%;background:rgba(30,36,52,.72);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.counts{margin-left:auto;background:rgba(30,36,52,.72);border-radius:44px;padding:16px 26px;font:800 32px Archivo;letter-spacing:6px}
.prog{position:absolute;top:0;left:0;width:104px;height:7px;background:#2346B8}
.pill{position:absolute;left:40px;top:1040px;background:#2346B8;color:#fff;font:800 22px Archivo;padding:10px 20px;border-radius:30px;letter-spacing:.5px}
.word{position:absolute;left:40px;top:1090px;color:#fff;font:900 {{WORDSIZE}}px Archivo,'{{CJK}}';line-height:1.2}
.mean{position:absolute;left:40px;top:1232px;color:#fff;font:800 50px Archivo}
.sent{position:absolute;left:40px;top:1306px;color:#fff;font:800 40px Archivo,'{{CJK}}'}
.sent b{color:#F5D90A;font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.tr{position:absolute;left:40px;top:1370px;color:#B9C0CF;font:600 30px Archivo}
.bot{position:absolute;left:0;top:1480px;width:780px;height:208px;background:url(bot.png)}
.next{position:absolute;inset:0;background:url(f-nekofront.png) 0 0/780px 1688px}
.row{position:absolute;top:118px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:34px}
.crest{width:200px;height:200px;border-radius:50%;background:#F5D90A;border:8px solid #14213D;box-shadow:8px 10px 0 #14213D;overflow:hidden;position:relative;animation:pop .42s cubic-bezier(.3,1.6,.5,1) 1.05s both}
.crest img{position:absolute;left:-6px;top:4px;width:205px}
.wm{width:540px;animation:slideL .5s cubic-bezier(.2,.8,.2,1) 1.25s both}
.cta{position:absolute;left:0;right:0;top:1556px;text-align:center;color:#14213D;font:800 80px Archivo;letter-spacing:-1px;animation:up .4s cubic-bezier(.2,.8,.2,1) 1.7s both}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-8px;right:-8px;top:22%;bottom:6%;background:#F5D90A;z-index:-1;transform-origin:0 50%;animation:grow .3s ease-out 2.0s both;border-radius:6px}
.url{position:absolute;left:0;right:0;top:1690px;text-align:center;color:#2346B8;font:600 40px Archivo;animation:up .4s cubic-bezier(.2,.8,.2,1) 1.9s both}
@keyframes phoneIn{from{transform:translateY(1500px)}to{transform:none}}
@keyframes outUp{from{transform:none}to{transform:translateY(-100%)}}
@keyframes inUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></head><body>
<div class="margin"></div>
<div class="row"><div class="crest"><img src="goose.png"></div><img class="wm" src="wm-navy.svg"></div>
<div class="phone"><div class="screen">
 <div class="card cardB"><div class="inner"><div class="next"></div></div></div>
 <div class="card cardA"><div class="inner">
  <div class="img"></div><div class="prog"></div>
  <div class="bar"><div class="circ">✕</div><span>Everything due</span><div class="counts"><span style="color:#8FB0FF">6</span> <span style="color:#F59E8B">0</span> <span style="color:#8BE0A4">0</span></div><div class="circ" style="font-size:34px">⚙</div></div>
  <div class="pill">{{PILL}}</div>
  <div class="word">{{WORD}}</div>
  <div class="mean">{{MEAN}}</div>
  <div class="sent">{{SENT}}</div>
  <div class="tr">{{TR}}</div>
  <div class="bot"></div>
 </div></div>
</div></div>
<div class="cta">Doom Scroll your <span class="hl">Vocab</span></div>
<div class="url">schwankiapp.com</div>
</body></html>
