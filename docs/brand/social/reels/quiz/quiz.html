<html><head><meta charset="utf-8">{{FONTS}}<base href="{{BASE}}"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#fff repeating-linear-gradient(to bottom,#fff 0 62px,#E6ECF7 62px 64px);position:relative;font-family:Archivo,'{{CJK}}'}
.margin{position:absolute;left:118px;top:0;bottom:0;width:3px;background:#C8372D;opacity:.45}
.slot{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:5}
.st{background:#fff;border:6px solid #14213D;border-radius:30px;box-shadow:8px 10px 0 #14213D;color:#14213D;padding:22px 40px;text-align:center;
 background-image:repeating-linear-gradient(#fff 0 58px,#E6ECF7 58px 61px);max-width:940px;font-weight:800;font-size:56px;line-height:1.15;transform:rotate(-2deg)}
.phone{position:absolute;left:204px;top:372px;width:672px;height:1417px;border-radius:84px;background:#14213D;padding:16px;box-shadow:12px 16px 0 rgba(20,33,61,.18)}
.screen{position:relative;width:640px;height:1385px;border-radius:68px;overflow:hidden;background:#232a3c}
.card{position:absolute;inset:0;will-change:transform}
.inner{position:absolute;left:0;top:0;width:780px;height:1688px;transform:scale(.8205);transform-origin:0 0;background:#232A3C;overflow:hidden}
.img{position:absolute;left:0;top:0;width:780px;height:1260px;background-size:cover;background-position:center 40%}
.img:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(35,42,60,.25) 0,transparent 12%,transparent 50%,rgba(35,42,60,.85) 78%,#232A3C 100%)}
.bar{position:absolute;top:18px;left:22px;right:22px;height:96px;display:flex;align-items:center;gap:18px;color:#fff;font:600 30px Archivo}
.circ{width:86px;height:86px;border-radius:50%;background:rgba(30,36,52,.72);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.counts{margin-left:auto;background:rgba(30,36,52,.72);border-radius:44px;padding:16px 26px;font:800 32px Archivo;letter-spacing:6px}
.prog{position:absolute;top:0;left:0;height:7px;background:#2346B8}
.pill{position:absolute;left:40px;top:1030px;background:#2346B8;color:#fff;font:800 24px Archivo;padding:10px 20px;border-radius:30px;letter-spacing:.5px}
.q,.a{position:absolute;left:0;right:0;top:0;bottom:0}
.qw{position:absolute;left:40px;right:40px;top:1086px;color:#fff;font:900 92px Archivo;line-height:1.15;white-space:nowrap}
.qa{position:absolute;left:40px;right:40px;top:1210px;color:#B9C0CF;font:700 48px Archivo;white-space:nowrap}
.timer{position:absolute;left:40px;right:40px;top:1290px;height:16px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.timer i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#F5D90A;border-radius:8px;transform-origin:0 50%}
.word{position:absolute;left:40px;right:40px;white-space:nowrap;top:1080px;color:#fff;font:900 {{WORDSIZE}}px Archivo,'{{CJK}}';line-height:1.2;transform-origin:0 60%}
.mean{position:absolute;left:40px;right:40px;white-space:nowrap;top:1224px;color:#fff;font:800 52px Archivo,'{{CJK}}'}
.sent{position:absolute;left:40px;right:40px;white-space:nowrap;top:1304px;color:#fff;font:800 50px Archivo,'{{CJK}}'}
.sent b{color:#F5D90A;font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.tr{position:absolute;left:40px;right:40px;white-space:nowrap;top:1378px;color:#B9C0CF;font:600 38px Archivo}
.bot{position:absolute;left:0;top:1480px;width:780px;height:208px;background:url(bot.png)}
</style></head><body>
<div class="margin"></div>
<div class="slot" style="top:112px"><div class="st">{{HOOK}}</div></div>
<div class="phone"><div class="screen" id="screen"></div></div>
<script>
const CARDS = {{CARDS}};
const T = {{TIMING}};
const LANG = {{LANG}};
const screen = document.getElementById('screen');
const els = CARDS.map((c, i) => {
  const d = document.createElement('div');
  d.className = 'card';
  d.style.zIndex = 10 - i;
  d.innerHTML = `<div class="inner">
    <div class="img" style="background-image:url('${c.image}')"></div>
    <div class="prog" style="width:${Math.round(780 * (i + 1) / CARDS.length)}px"></div>
    <div class="bar"><div class="circ">✕</div><span>${c.deck || ''}</span><div class="counts"><span style="color:#8FB0FF">${CARDS.length - i}</span> <span style="color:#F59E8B">0</span> <span style="color:#8BE0A4">${i}</span></div></div>
    <div class="pill">${LANG} · ${i + 1} OF ${CARDS.length}</div>
    <div class="q"><div class="qw">${c.prompt}</div><div class="qa">${c.ask}</div><div class="timer"><i></i></div></div>
    <div class="a"><div class="word">${c.word}</div><div class="mean">${c.mean}</div><div class="sent">${c.sent}</div><div class="tr">${c.tr}</div></div>
    <div class="bot"></div></div>`;
  screen.appendChild(d);
  return d;
});
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
const inout = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// t in seconds from the start of the quiz.
window.renderAt = (t) => {
  els.forEach((d, i) => {
    const t0 = i * T.card, lt = t - t0;
    // Swipe: card i leaves upward at the end of its slot (not the last card); the next card rises behind it.
    const out = i < els.length - 1 ? inout((lt - T.swipe) / T.swipeDur) : 0;
    const inn = i > 0 ? inout((lt + T.card - T.swipe) / T.swipeDur) : 1;
    d.style.transform = `translateY(${(-out * 100 + (1 - inn) * 100).toFixed(3)}%)`;
    d.style.visibility = lt < -T.card + T.swipe - 0.01 || out >= 1 ? 'hidden' : 'visible';
    const q = d.querySelector('.q'), a = d.querySelector('.a');
    const rv = lt - T.reveal;
    q.style.opacity = 1 - ease(rv / 0.12);
    d.querySelector('.timer i').style.transform = `scaleX(${(1 - Math.min(1, Math.max(0, (lt - T.timerStart) / (T.reveal - T.timerStart)))).toFixed(4)})`;
    a.style.opacity = rv < 0 ? 0 : 1;
    d.querySelector('.word').style.transform = `scale(${(0.6 + 0.4 * back(rv / 0.28)).toFixed(4)})`;
    for (const [sel, delay] of [['.mean', 0.12], ['.sent', 0.24], ['.tr', 0.34]]) {
      const p = ease((rv - delay) / 0.25), n = d.querySelector(sel);
      n.style.opacity = p; n.style.transform = `translateY(${(1 - p) * 30}px)`;
    }
  });
};
window.renderAt(0);
</script>
</body></html>
